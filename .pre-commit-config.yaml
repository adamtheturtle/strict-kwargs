---
# Developer tooling for this repo. Mirrors `.github/workflows/lint.yml` so
# contributors catch the same failures locally that CI enforces.
#
# Install (one command):
#
#     prek install      # or: pre-commit install
#
# Run both installed stages locally, matching CI's pre-commit job:
#
#     uvx prek run --all-files --hook-stage pre-commit
#     uvx prek run --all-files --hook-stage pre-push
#
# File hygiene and workflow checks run at pre-commit. `cargo fmt` and
# `cargo clippy` run at pre-push. CI docs and tests have their own jobs.
#
fail_fast: false
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: ^tests/snapshots/.*\.snap$
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
      - id: check-vcs-permalinks
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        stages: [pre-commit]
        args: [--fix=lf]
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        stages: [pre-commit]
        # Do not auto-apply fixes. When pre-commit passes explicit
        # filenames, typos bypasses `_typos.toml`'s `extend-exclude`, so
        # mirror those exclusions here.
        args: []
        exclude: '^(vendored/|Cargo\.lock$|uv\.lock$)'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        stages: [pre-commit]
        # Rule policy lives in the repo-root `zizmor.yml` (mirrors
        # mypy-strict-kwargs), so no severity flags are needed here.

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        stages: [pre-commit]
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        stages: [pre-push]
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        stages: [pre-push]
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # ``uvx`` rather than ``uv run``: this project is a maturin build, and
      # ``uv run`` would compile the Rust crate before every commit.
      - id: no-defaults
        name: no-defaults
        entry: uvx no-defaults@1.0.1
        language: system
        types: [python]
        exclude: ^vendored/typeshed/
        stages: [pre-commit]

      # Vale enforces prose style rules, such as banning em dashes, in
      # reStructuredText files.
      # The rules come from the ``ClearProse`` package pinned in ``.vale.ini``,
      # which ``vale sync`` downloads into the (gitignored) ``styles``
      # directory.
      # ``vale sync`` also runs when ``.vale.ini`` changes, so a package
      # bump takes effect without waiting for the next reStructuredText
      # change.
      # Vale needs ``rst2html`` from Docutils on the ``PATH`` to parse
      # reStructuredText, hence ``--with docutils``.  ``uvx`` rather than
      # ``uv run`` for the reason given above.
      - id: vale-sync
        name: vale sync
        entry: uvx --with docutils vale@3.13.0.0 sync
        language: system
        files: (\.rst$|^\.vale\.ini$)
        pass_filenames: false
        stages: [pre-commit]

      - id: vale
        name: vale
        entry: uvx --with docutils vale@3.13.0.0
        language: system
        types_or: [rst]
        require_serial: true
        stages: [pre-commit]
