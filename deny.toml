[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.93

# Additional licenses used by the pinned ty engine; keep these version-scoped.
exceptions = [
    { name = "colored", version = "=3.1.1", allow = ["MPL-2.0"] },
    { name = "foldhash", version = "=0.2.0", allow = ["Zlib"] },
    { name = "inotify", version = "=0.11.5", allow = ["ISC"] },
    { name = "inotify-sys", version = "=0.1.8", allow = ["ISC"] },
    { name = "matchit", version = "=0.9.2", allow = ["BSD-3-Clause"] },
    { name = "notify", version = "=8.2.2", allow = ["CC0-1.0"] },
    { name = "option-ext", version = "=0.2.0", allow = ["MPL-2.0"] },
    { name = "version-ranges", version = "=0.1.3", allow = ["MPL-2.0"] },
    { name = "zlib-rs", version = "=0.6.8", allow = ["Zlib"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "hashbrown@0.16.1", reason = "get-size2 uses 0.16 while indexmap uses 0.17" },
    { crate = "syn@2.0.117", reason = "get-size2 and benchmark macros use syn 2 while clap and serde use syn 3" },
    { crate = "attribute-derive@0.10.5", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "attribute-derive-macro@0.10.5", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "compact_str@0.9.0", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "get-size-derive2@0.7.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "get-size2@0.7.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "getrandom@0.2.17", reason = "The native parser build uses rand 0.8 and getrandom 0.2 while ty uses getrandom 0.4" },
    { crate = "hashbrown@0.14.5", reason = "Dashmap requires 0.14 while get-size2 and ty use newer hashbrown releases" },
    { crate = "itertools@0.14.0", reason = "Native parser and benchmark macros require 0.14 while ty requires 0.15" },
    { crate = "manyhow@0.11.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "manyhow-macros@0.11.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "phf@0.11.3", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "phf_codegen@0.11.3", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "phf_generator@0.11.3", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "phf_shared@0.11.3", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "quote-use@0.8.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "quote-use-macros@0.8.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "rand@0.8.6", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "rand_core@0.6.4", reason = "The native parser uses this older release while the pinned ty engine requires a newer incompatible release" },
    { crate = "wit-bindgen@0.51.0", reason = "Getrandom uses WASI 0.3 and 0.4 adapters with different generated wit-bindgen versions" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/astral-sh/ruff"]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
