[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.9.3,<2" ]

[project]
name = "strict-kwargs"
version = "2026.10.9"
description = "Enforce using keyword arguments where possible."
# Avoid Pyroma treating parameterized Markdown as reStructuredText.
# https://github.com/regebro/pyroma/issues/135
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = [ "LICENSE", "THIRD_PARTY_NOTICES.md", "third-party-licenses/*" ]
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.11"
# Python wheels embed the pinned inference engine.
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [ "lint", "keyword-arguments", "ty", "mypy" ]
urls.Source = "https://github.com/adamtheturtle/strict-kwargs"
urls.Changelog = "https://github.com/adamtheturtle/strict-kwargs/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyroma==5.0.1",
    "snapper-fmt==0.11.10",
]
release = [ "check-wheel-contents==0.6.3", "towncrier==26.9.0" ]

[tool.maturin]
features = [ "embedded-ty" ]
bindings = "bin"
module-name = "strict_kwargs"

[tool.towncrier]
# Write the same native Markdown file used by documentation and GitHub releases.
directory = "newsfragments"
filename = "changelog/{version}.md"
title_format = "# {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/adamtheturtle/strict-kwargs/issues/{issue})"
single_file = false
# Reject invalid fragment names instead of silently losing release entries.
ignore = [ ".gitkeep" ]
type = [ { directory = "change", name = "Changes", showcontent = true }, { directory = "bugfix", name = "Changes", showcontent = true } ]

[tool.strict_kwargs]
ignore_names = []

[tool.no_defaults]
private_only = true
per_file_enforcement."tests/**" = "all"
