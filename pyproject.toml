[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.8,<2" ]

[project]
name = "strict-kwargs"
version = "2026.8.28-post.2"
description = "Enforce using keyword arguments where possible."
# Avoid Pyroma treating parameterized Markdown as reStructuredText.
# https://github.com/regebro/pyroma/issues/135
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.11"
# `ty` is the required type-inference backend.
# Floor, not a pin: `0.0.80` is the version the LSP/hover integration was
# verified against, so it is the minimum; newer `ty` is allowed. ty is
# pre-1.0, so a future release could change the hover/LSP surface — hover
# parsing is best-effort and fails closed (a miss, never a wrong
# diagnostic), so a drift degrades coverage rather than correctness.
# `uv tool install strict-kwargs` does not put a dependency's entry point on
# PATH, so the binary locates this `ty` next to itself (see `ty_command`).
dependencies = [ "ty>=0.0.80" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [ "lint", "keyword-arguments", "ty", "mypy" ]
urls.Source = "https://github.com/adamtheturtle/strict-kwargs"
urls.Changelog = "https://github.com/adamtheturtle/strict-kwargs/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyroma==5.0.1",
    "snapper-fmt==0.11.8",
]
release = [ "check-wheel-contents==0.6.3", "towncrier==26.9.0" ]

[tool.maturin]
bindings = "bin"
module-name = "strict_kwargs"

[tool.towncrier]
# Write the same native Markdown file used by documentation and GitHub releases.
directory = "newsfragments"
filename = "changelog/{version}.md"
title_format = "# {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/adamtheturtle/strict-kwargs/issues/{issue})"
single_file = false
# Reject invalid fragment names instead of silently losing release entries.
ignore = [ ".gitkeep" ]
type = [ { directory = "change", name = "Changes", showcontent = true }, { directory = "bugfix", name = "Changes", showcontent = true } ]

[tool.strict_kwargs]
ignore_names = []

[tool.no_defaults]
private_only = true
per_file_enforcement."tests/**" = "all"
