---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run at 1:00 every day
    - cron: 0 1 * * *

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-${{ matrix.platform }}

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features --document-private-items

  pre-commit:
    # Runs the explicit prek stages documented in `prek.toml`.
    # `pre-commit` owns file hygiene and workflow checks; `pre-push` owns
    # `cargo fmt` and `cargo clippy`.
    strategy:
      matrix:
        hook-stage: [pre-commit, pre-push]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-pre-commit

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run prek hooks (${{ matrix.hook-stage }})
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.4.11
          extra-args: >-
            --all-files --hook-stage ${{ matrix.hook-stage }}
            --verbose

  hawk:
    runs-on: ubuntu-latest
    env:
      HAWK_VERSION: 0.1.15
      HAWK_SHA256: c50189129c43f026b19a0e7da2a405ab2599ff9426a826f7db8ab64d7274d1d5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain required by Hawk
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target/hawk"
      - name: Install Hawk
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/hawk.tar.gz" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_SHA256}  ${RUNNER_TEMP}/hawk.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/hawk.tar.gz" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cargo-hawk-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"
      - name: Check Rust visibility
        run: cargo hawk check --target-dir target/hawk -D warnings -D hawk::unnecessary_crate_visibility

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-machete@0.9.2
      - name: Check for unused Rust dependencies
        run: cargo machete

  msrv:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: msrv-${{ matrix.os }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-msrv@0.19.3
      - name: Verify the declared minimum Rust version
        run: cargo msrv verify --no-log -- cargo check --locked --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny@0.20.2
      - name: Check Rust dependency policy
        run: cargo deny --locked check -D warnings

  completion-lint:
    needs: [build, pre-commit, hawk, machete, msrv, deny]
    runs-on: ubuntu-latest
    if: always()  # Run even if one matrix job fails
    steps:
      - name: Check job statuses
        env:
          UV_NO_CACHE: '1'
          BUILD_RESULT: ${{ needs.build.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          HAWK_RESULT: ${{ needs.hawk.result }}
          MACHETE_RESULT: ${{ needs.machete.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          DENY_RESULT: ${{ needs.deny.result }}
        run: |-
          if [ "$BUILD_RESULT" != "success" ] \
            || [ "$PRE_COMMIT_RESULT" != "success" ] \
            || [ "$HAWK_RESULT" != "success" ] \
            || [ "$MSRV_RESULT" != "success" ] \
            || [ "$MACHETE_RESULT" != "success" ] \
            || [ "$DENY_RESULT" != "success" ]; then
            echo "One or more lint jobs failed"
            exit 1
          fi
