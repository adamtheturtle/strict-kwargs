name: Fuzz tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [signatures, source-encoding, source-insertions]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the fuzzing compiler
        run: |
          rustup toolchain install nightly-2026-09-05 --profile minimal --component rust-src
          rustup toolchain install 1.99.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: "fuzz -> target"
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-fuzz@0.13.2,cargo-deny@0.20.2
      - name: Audit fuzz dependencies
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check -D warnings
      - name: Seed the corpus
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/${FUZZ_TARGET}"
          cp "fuzz/seeds/${FUZZ_TARGET}/"* "fuzz/corpus/${FUZZ_TARGET}/"
      - name: Check fuzz target formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Lint the fuzz-only entry points
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo +1.99.0 clippy --locked --lib -- -D warnings
      - name: Fetch locked fuzz dependencies
        run: cargo +nightly-2026-09-05 fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Build the fuzz target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          CARGO_NET_OFFLINE: "true"
        run: cargo +nightly-2026-09-05 fuzz build --target x86_64-unknown-linux-gnu "${FUZZ_TARGET}"
      - name: Run the bounded fuzz test
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo +nightly-2026-09-05 fuzz run --target x86_64-unknown-linux-gnu "${FUZZ_TARGET}" -- \
            -max_total_time="${FUZZ_SECONDS}" -timeout=10 -rss_limit_mb=2048 -max_len=4096
      - name: Verify the fuzz lockfile
        run: git diff --exit-code -- fuzz/Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
